name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'github-actions[bot]'
    steps:
      - name: Proceed
        env:
          ACTOR: ${{ github.actor }}
        run: echo "CI proceeding for $ACTOR"

  lint:
    name: Lint & Typecheck
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs never use GITHUB_TOKEN for git operations, but they run
          # repo-controlled scripts (yarn install/prepare/lint/test). Don't leave
          # the token in .git/config where those scripts could read it.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    name: Test
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs never use GITHUB_TOKEN for git operations, but they run
          # repo-controlled scripts (yarn install/prepare/lint/test). Don't leave
          # the token in .git/config where those scripts could read it.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build:
    name: Build Package
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs never use GITHUB_TOKEN for git operations, but they run
          # repo-controlled scripts (yarn install/prepare/lint/test). Don't leave
          # the token in .git/config where those scripts could read it.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build compiled artifacts
        run: yarn prepare

  audit:
    name: Security Audit
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs never use GITHUB_TOKEN for git operations, but they run
          # repo-controlled scripts (yarn install/prepare/lint/test). Don't leave
          # the token in .git/config where those scripts could read it.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: yarn npm audit --environment production
